<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Font configuration used ONLY when converting sanitized DOCX templates to PDF
  with LibreOffice (scripts/templates/convert.py).

  The original Word documents use proprietary fonts (Traditional Arabic,
  Simplified Arabic, Janna LT, DINArabic, Arial Unicode MS) that cannot be
  redistributed. They are mapped here to the closest open-licensed (SIL OFL)
  fonts shipped in templates/fonts. If you hold licences for the original
  fonts, drop the .ttf files into templates/fonts-licensed/ (git-ignored) and
  they will take precedence automatically.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">../../templates/fonts-licensed</dir>
  <dir prefix="relative">../../templates/fonts</dir>

  <!-- Proprietary Arabic families -> open equivalents -->
  <alias binding="same"><family>Traditional Arabic</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>Simplified Arabic</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>Arabic Typesetting</family><prefer><family>Amiri</family></prefer></alias>
  <alias binding="same"><family>Janna LT</family><prefer><family>Tajawal</family></prefer></alias>
  <alias binding="same"><family>DINArabic-Black</family><prefer><family>Cairo</family></prefer></alias>
  <alias binding="same"><family>DIN Next LT Arabic</family><prefer><family>Cairo</family></prefer></alias>
  <alias binding="same"><family>Arial Unicode MS</family><prefer><family>Liberation Sans</family><family>Noto Sans Arabic</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>

  <!-- Glyph fallback for Arabic characters requested from Latin-only fonts (e.g. Arial) -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <edit name="family" mode="prepend"><string>Noto Naskh Arabic</string></edit>
  </match>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family><family>Noto Sans Arabic</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Liberation Serif</family><family>Noto Naskh Arabic</family></prefer>
  </alias>
</fontconfig>
